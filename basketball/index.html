<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<meta name="apple-mobile-web-app-title" content="Baylor Stats">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#154734">
<title>Baylor Basketball</title>
<script>/* BASKETBALL V2: apply saved theme before paint */window.bbv2Apply=function(t){var d=document.documentElement;if(!/^(classic|gold-green|throwback|gameday-paws|gameday-bear|script-green)$/.test(t||""))t="classic";d.dataset.theme=t;d.classList.toggle("wall",/^(gameday-paws|gameday-bear|script-green)$/.test(t));d.classList.toggle("plain",/^(classic|gold-green)$/.test(t));d.classList.toggle("eighties",/^(throwback|gameday-)/.test(t));return t};try{bbv2Apply(localStorage.getItem("bbv2-theme"))}catch(e){bbv2Apply("classic")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F3EBD8;--paper:#FAF5E9;--ink:#1c1c1a;--muted:#6f6a5e;--line:#d9cfb8;--green:#154734;--green2:#2f6b52;--gold:#FFB81C;--sage:#9dbba9;--red:#c8553d;--blue:#7d9bd1;--opp:#3a3a3a;--opp2:#7a7670;--opp3:#a9a49b}
*{box-sizing:border-box}
html,body{margin:0;background:#11110f;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px 10px 40px}
.top{display:flex;justify-content:space-between;align-items:center;background:#11110f;color:#f3ebd8;padding:6px 4px 10px}
.brand{font-family:Oswald;font-weight:700;font-size:20px;letter-spacing:.5px}
.brand span{color:var(--gold)}
.brand{display:flex;align-items:center;gap:7px}.brand span{margin-left:-2px}.blogo{height:28px;width:auto}
.src{font-size:11px;color:#a9a49b;text-align:right}
.rf{margin-top:6px;background:transparent;border:1px solid #57544c;color:#f3ebd8;border-radius:999px;padding:4px 10px;font:600 11px Inter,system-ui,sans-serif;cursor:pointer}
.rf:disabled{opacity:.5}
#rfmsg{margin-top:3px;max-width:180px;margin-left:auto}
.home{color:#a9a49b;font:500 11px Inter,system-ui,sans-serif;text-decoration:none;display:block;margin-bottom:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid #3c3b36;background:#1d1c19;color:#e8e0cc;border-radius:999px;padding:6px 11px;font:600 12px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);color:#1c1c1a;border-color:var(--gold)}
.chip .r{font-weight:700;margin-left:4px}
.chip.LV .r{color:#ff8a73}
.chip.LV.on .r{color:var(--red)}
.wl.LV{width:auto;padding:0 10px;font-size:16px;background:var(--red)}
.card{background:var(--cream);border-radius:6px;margin:0 0 12px;overflow:hidden}
.card .hd{background:#1d1c19;color:#f3ebd8;display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font:700 11px Oswald,'Arial Narrow',sans-serif;letter-spacing:1.6px;text-transform:uppercase}
.card .bd{padding:14px}
.score{display:flex;align-items:center;gap:10px;justify-content:space-between}
.score h1{margin:0;font:700 clamp(22px,5.6vw,34px)/1.05 Oswald;text-transform:uppercase;letter-spacing:.3px}
.wl{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;font:700 24px Oswald,'Arial Narrow',sans-serif;color:#fff;background:var(--green)}
.wl.L{background:var(--red)}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.rule{border:0;border-top:2px solid var(--ink);margin:12px 0}
.label{font:600 11px Oswald,'Arial Narrow',sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.strong{font:700 12px Oswald,'Arial Narrow',sans-serif;letter-spacing:1.2px;text-transform:uppercase}
/* scoring bars */
.sb{display:grid;grid-template-columns:minmax(70px,110px) 1fr 1fr 44px;gap:6px 8px;align-items:center;margin-top:8px}
.sb .tm{font:700 13px Oswald,'Arial Narrow',sans-serif;text-transform:uppercase}
.bar{display:flex;height:20px;align-items:stretch}
.bar i{display:flex;align-items:center;justify-content:center;font:600 10px Inter,system-ui,sans-serif;color:#fff;font-style:normal;overflow:hidden;white-space:nowrap}
.bar b{font:700 12px Oswald,'Arial Narrow',sans-serif;margin-left:5px;align-self:center}
.sb .tot{font:700 22px Oswald,'Arial Narrow',sans-serif;text-align:right}
.legend{display:flex;gap:10px;font:600 10px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
/* svg */
svg{display:block;width:100%;height:auto}
#flowsvg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.courts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.court-h{flex-direction:column;font-size:11px}}
.court-h{display:flex;justify-content:space-between;font:700 12px Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;margin-bottom:4px}
/* compare */
.cmp{display:grid;grid-template-columns:minmax(78px,1fr) minmax(60px,1.3fr) auto;gap:9px 10px;align-items:center}
.cmp .m{line-height:1.15;font:600 13px Oswald,'Arial Narrow',sans-serif}
.trk{position:relative;height:16px}
.trk:before{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:#ddd3bd;border-radius:2px}
.trk .seg{position:absolute;top:7px;height:3px;background:var(--green)}
.trk .seg.bad{background:var(--red)}
.trk .u,.trk .t{position:absolute;top:1px;width:15px;height:15px;border-radius:50%;margin-left:-7.5px}
.trk .u{background:var(--cream);border:2px solid var(--ink)}
.trk .t{background:var(--green)}
.trk .t.bad{background:var(--red)}
.trk .t.same{background:#9b958a}
.vd{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;min-width:128px;background:var(--green);color:#fff;padding:5px 8px;font:600 11px Inter,system-ui,sans-serif;border-radius:2px}
.vd.bad{background:var(--red)}.vd.same{background:#a9a397}
.vd .k{font:700 11px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;align-self:center}
.cmp .raw{grid-column:1/-1;margin:-5px 0 3px;font:500 11px Inter,system-ui,sans-serif;color:var(--muted);padding-bottom:7px;border-bottom:1px solid #e4dccb}
.cmp .raw b{font:700 10px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--ink);margin-right:3px}
.cmp .raw .sep{margin:0 6px}
.trk:after{content:"";position:absolute;left:50%;top:3px;width:1px;height:11px;background:#c9bfa6}
.sec{font:700 12px Oswald,'Arial Narrow',sans-serif;letter-spacing:1.4px;color:var(--green);text-transform:uppercase;margin:4px 0 8px}
.sec small{color:var(--muted);font:500 10px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;margin-left:8px}
/* box */
.box{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--ink);margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:12px}
th{background:var(--green);color:#fff;font:600 11px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;padding:6px 5px;text-align:center}
th:first-child{text-align:left}
td{padding:4px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font:600 12px Oswald,'Arial Narrow',sans-serif;position:sticky;left:0;background:var(--cream)}
td:first-child small{color:var(--muted);font:500 9px Oswald,'Arial Narrow',sans-serif;margin-left:3px}
tr.bench td{border-top:0}
tr.split td{border-top:2px solid var(--ink)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:#ebe1c9}
tr.tot td:first-child{background:#ebe1c9}
tr.dnp td{color:#a39d90}
.opp th{background:#1d1c19}
.hot{background:#e9a594;border-radius:2px;padding:1px 4px}
.cold{background:#a9bde4;border-radius:2px;padding:1px 4px}
.hi{background:var(--ink);color:#fff;border-radius:2px;padding:1px 4px}
.opp .hi{background:var(--ink)}
.bay .hi{background:var(--green)}
.pct{font-size:9px;color:var(--muted);margin-left:2px}
.foot{font:500 9.5px Oswald,'Arial Narrow',sans-serif;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin-top:8px;line-height:1.4}
/* watch */
.big{font:700 44px/1 Oswald,'Arial Narrow',sans-serif;color:var(--green)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.f{border:1px solid var(--ink);background:transparent;padding:5px 10px;font:600 11px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;cursor:pointer;border-radius:2px;color:var(--ink)}
.f.on{background:var(--ink);color:var(--cream)}
.wt td{font-size:12px;padding:4px 3px}.wt th{padding:6px 3px}
.wt input{width:58px;padding:3px 4px;border:1px solid var(--line);background:var(--paper);font:500 12px Inter,system-ui,sans-serif;text-align:center;border-radius:2px}
.wt tr.out td{color:#aaa49a}
.tip{position:fixed;pointer-events:none;background:#1d1c19;color:#f3ebd8;font:500 11px Inter,system-ui,sans-serif;padding:5px 7px;border-radius:3px;display:none;z-index:9;max-width:220px}
.seasons{display:grid;grid-template-columns:58px 1fr 78px;gap:6px 8px;align-items:center}
.sl{font:600 12px Oswald,'Arial Narrow',sans-serif}
.sbar{height:16px;background:#e6dcc4}
.sbar i{display:block;height:100%;background:#8e8a80}
.sbar i.cur{background:var(--green)}
.sv{font-size:12px;white-space:nowrap}.sv b{font:700 14px Oswald,'Arial Narrow',sans-serif}.sv span{color:var(--muted);font-size:11px}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.empty{color:#e8e0cc;padding:30px;text-align:center}
.home{color:#a9a49b;font:500 11px Inter,system-ui,sans-serif;text-decoration:none;display:block;margin-bottom:2px}
.pick{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:#a9a49b;font:600 11px Oswald,'Arial Narrow',sans-serif;letter-spacing:1.2px;text-transform:uppercase}
.sel{background:#1d1c19;color:#f3ebd8;border:1px solid #3c3b36;border-radius:4px;padding:6px 8px;font:600 13px Inter,system-ui,sans-serif}
.chip.L .r{color:#e88c78}.chip.on.L .r{color:#7a1f10}
.wt tr.pick-row{cursor:pointer}
.pl{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:#b9af97;text-underline-offset:3px}
.ov{position:fixed;inset:0;overscroll-behavior:contain;background:rgba(17,17,15,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
@media(min-width:560px){.ov{align-items:center}}
.pc{background:var(--cream);width:100%;max-width:440px;border-radius:10px 10px 0 0;overflow:hidden;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column}
.pc .pscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body.noscroll{overflow:hidden}
@media(min-width:560px){.pc{border-radius:8px}}
.pc .ph{background:var(--green);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex:none}
.pc .num{font:700 40px/1 Oswald,'Arial Narrow',sans-serif;color:var(--gold);min-width:54px;text-align:center}
.pc .nm{font:700 22px/1.1 Oswald,'Arial Narrow',sans-serif;text-transform:uppercase}
.pc .bio{font-size:12px;opacity:.85;margin-top:3px}
.pc .x{margin-left:auto;align-self:flex-start;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.pc .pb{padding:14px 16px}
.stars{font-size:20px;letter-spacing:2px;color:var(--gold);-webkit-text-stroke:.5px #8a6a10}
.stars .off{color:#ddd3bd;-webkit-text-stroke:0}
.grl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0}.grk{font:600 10px Oswald,'Arial Narrow',sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);min-width:78px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.pn{font:700 30px/.95 Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;color:var(--green);margin:2px 0 2px}.pn span{display:block;color:var(--ink)}
.pmeta{font:500 12px Inter,system-ui,sans-serif;color:var(--muted)}
.big4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 4px}
.big4 div{border-top:3px solid var(--green);padding-top:4px}
.big4 b{display:block;font:700 40px/1 Oswald,'Arial Narrow',sans-serif;color:var(--green)}.big4 div:first-child b{color:var(--ink)}
.big4 span,.sc3 span,.bot4 span{font:600 10px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.pshot{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;align-items:center;margin-top:8px}
.pshot svg{width:100%;display:block}
.sc3 div{margin-bottom:8px}.sc3 b{display:block;font:700 32px/1 Oswald,'Arial Narrow',sans-serif;color:var(--green)}
.bot4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:2px solid var(--green);margin-top:12px;padding-top:8px}
.bot4 b{display:block;font:700 22px/1.05 Oswald,'Arial Narrow',sans-serif;color:var(--green);white-space:nowrap}.bot4 b small{font-size:12px;color:var(--muted);margin-left:2px}
.pfoot{background:var(--green);color:#e8e2d2;font-size:10px;padding:8px 16px}
.pg div{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px;text-align:center}
.pg b{display:block;font:700 18px Oswald,'Arial Narrow',sans-serif}
.pg span{font:600 9px Oswald,'Arial Narrow',sans-serif;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.rec{display:flex;align-items:center;gap:14px;background:var(--cream);border-radius:6px;padding:12px 14px;margin:0 0 12px}
.rec .wl2{font:700 40px/1 Oswald,'Arial Narrow',sans-serif;color:var(--green);white-space:nowrap}
.rec .lbl{font:600 10px Oswald,'Arial Narrow',sans-serif;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.rec .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px 10px;flex:1}
.rec .grid b{display:block;font:700 17px Oswald,'Arial Narrow',sans-serif}
.rec .form{display:flex;gap:3px;margin-top:3px}
.rec .form i{width:16px;height:16px;display:grid;place-items:center;font:700 9px Inter,sans-serif;font-style:normal;color:#fff;background:var(--green);border-radius:2px}
.rec .form i.L{background:var(--red)}
@media(max-width:420px){.rec{flex-direction:column;align-items:flex-start}.rec .grid{width:100%}}
/* ---- game card, styled after the @mcbaylor graphics ---- */
.gc{background:var(--cream);border-radius:6px;margin:0 0 12px;overflow:hidden}
.gc .in{padding:16px 16px 14px}
@media(max-width:560px){.gc .in{padding:14px 11px 12px}}
.gc .cf{background:var(--green);color:#e8e0cc;padding:9px 16px;font:400 10px/1.4 Inter,system-ui,sans-serif}
.sh{display:flex;align-items:center;gap:6px 10px;margin:18px 0 10px;flex-wrap:wrap}
.sh .cap{margin-left:auto}
.sh:first-child{margin-top:4px}
.sh .bx{border:2px solid var(--green);color:var(--green);padding:3px 8px 2px;font:700 13px Oswald,'Arial Narrow',sans-serif;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.sh i{flex:1;border-top:1px solid #b9af97;min-width:12px}
.sh .cap{font:500 12px Oswald,'Arial Narrow',sans-serif;color:var(--muted);text-align:right}
.lg{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.lg img{display:none;height:34px;width:auto;max-width:44px}
.lg.ok img{display:block}.lg.ok .tbadge{display:none}
.tbadge{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 4px;border-radius:4px;font:700 11px Oswald,'Arial Narrow',sans-serif;letter-spacing:.5px}
.sbd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sbd .tm{display:flex;align-items:center;gap:8px;font:700 clamp(15px,4.4vw,24px)/1.05 Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;color:var(--green)}
.sbd .tm.r{justify-content:flex-end;text-align:right;color:#8a857a}
.sbd .mid{text-align:center}
.fin{display:inline-block;background:var(--green);color:#f3ebd8;font:700 12px Oswald,'Arial Narrow',sans-serif;letter-spacing:2px;padding:4px 10px;text-transform:uppercase}
.fin.lv{background:var(--red)}
.bigs{font:700 clamp(46px,14vw,80px)/1 Oswald,'Arial Narrow',sans-serif;white-space:nowrap;margin-top:4px;letter-spacing:-1px}
.bigs .w{color:var(--green)}.bigs .l{color:#9b968b}.bigs .ow{color:#1d1c19}
.bigs i{font-style:normal;color:var(--gold);font-size:.55em;vertical-align:.35em;margin:0 .12em}
.sbd .tm .kp{display:block;font:500 12px Oswald,'Arial Narrow',sans-serif;color:var(--muted);text-transform:none;letter-spacing:.3px;margin-top:3px}
.meta{text-align:center;font:500 13px Oswald,'Arial Narrow',sans-serif;color:var(--muted);margin-top:6px}
@media(max-width:480px){.sbd .tm{flex-direction:column;gap:4px}.sbd .tm.r{flex-direction:column-reverse;align-items:flex-end}.sbd .tm:not(.r){align-items:flex-start}}
/* points bars */
.pts{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.pts .tn{display:flex;align-items:center;gap:6px;font:700 16px Oswald,'Arial Narrow',sans-serif;text-transform:uppercase}
.pts .tn .lg img{height:22px}
.pts .bar{height:26px}
.pts .bar i{font:600 12px Oswald,'Arial Narrow',sans-serif}
.pts .tot{font:700 26px Oswald,'Arial Narrow',sans-serif;text-align:right}
.lgd{display:flex;gap:10px;font:500 11px Oswald,'Arial Narrow',sans-serif;color:var(--muted);white-space:nowrap}
.lgd i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
/* box score: fits the screen, no side scrolling */
.bxh{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px;font:700 20px Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;color:var(--green)}
.bxh small{font:500 12px Oswald,'Arial Narrow',sans-serif;color:var(--muted);text-transform:none}
.bxh.o{color:#6e6a63}
table.bs{width:100%;min-width:0;border-collapse:collapse;table-layout:auto;font:500 13px Oswald,'Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.bs th{background:none;color:var(--green);font:700 .9em Oswald,'Arial Narrow',sans-serif;letter-spacing:.5px;padding:4px 3px;border-bottom:2px solid var(--ink);text-align:center}
.bs td{padding:5px 3px;border-bottom:1px solid #ddd3bd;text-align:center;white-space:nowrap;background:none;position:static;font:inherit}
.bs td.no,.bs th.no{text-align:right;color:var(--muted);padding-right:6px;width:1%}
.bs td.nm,.bs th.nm{text-align:left;font-weight:700;line-height:1.15}
.bs td.nm .ps{color:var(--muted);font-weight:500;font-size:11px;margin-left:4px;white-space:nowrap}
.bs tr.split td{border-top:2px solid var(--ink)}
.bs tr.tot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;font-size:14px;background:none}
.bs .hot,.bs .cold,.bs .hi{display:inline-block;padding:1px 4px;border-radius:2px;line-height:1.2}
.bs .hot{background:#ecb7ab}.bs .cold{background:#c3cfe9}
.bs .hi{background:var(--green);color:#fff}
.bs .pct{font-size:9px;color:#5f5a50;margin-left:2px}
.bs .pl{text-decoration-thickness:1px;text-decoration-color:#cdc3aa}
/* one line per player; fitBox() shrinks the font until the table fits the screen */
.bxw{width:100%;overflow:hidden}
.bs td.nm,.bs th.nm{white-space:nowrap}
.bs td.nm .ps{font-size:.78em}
.bs .pct{font-size:.68em}
.bs td.no{font-size:.9em}
.bs tr.tot td,.bs td.nm{font-size:1.05em}

  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- data ---------- */
async function getJSON(url, ms = 15000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, {signal: ctl.signal, cache: "no-store"}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function loadIndex(){ B = await getJSON(DATA + "mbb.json?t=" + Date.now()); }
async function loadGame(id){
  if (!GAMES[id]) GAMES[id] = await getJSON(DATA + "games/" + id + ".json");
  return GAMES[id];
}
const curSeason = () => B.seasons.find(s => s.year === B.seasonYear) || B.seasons[B.seasons.length - 1];
function findGame(id){ for (const s of B.seasons) { const g = s.games.find(x => x.id === id); if (g) return {s, g}; } return null; }

/* ESPN summary -> the same compact shape build_mbb.py writes (used by live refresh) */
function compact(s){
  const comp = s.header.competitions[0];
  const teams = comp.competitors.map(c => { const bt = s.boxscore.teams.find(t => t.team.id === c.team.id) || {}; const st = {};
    (bt.statistics || []).forEach(x => st[x.name] = x.displayValue);
    return {id: c.team.id, abbr: c.team.abbreviation, name: c.team.displayName, loc: c.team.location, color: c.team.color, homeAway: c.homeAway, score: c.score, stats: st}; });
  const players = {};
  (s.boxscore.players || []).forEach(p => { const st = (p.statistics || [{}])[0];
    players[p.team.id] = {keys: st.keys || [], athletes: (st.athletes || []).map(a => [a.athlete.displayName || a.athlete.shortName || "—", (a.athlete.position || {}).abbreviation || "", !!a.starter, a.stats || [], a.athlete.jersey || "", a.athlete.id || ""])}; });
  const plays = [];
  (s.plays || []).forEach(p => { const typ = p.type.text, tv = /TVTime/i.test(typ), shot = !!p.shootingPlay;
    if (!(tv || shot || p.scoringPlay)) return;
    const co = p.coordinate || {};
    plays.push([p.period.number, p.clock.displayValue, (p.team || {}).id, p.homeScore, p.awayScore, tv ? "T" : (/FreeThrow/i.test(typ) ? "F" : "S"),
      p.scoringPlay ? (p.scoreValue || 0) : 0, co.x, co.y, p.scoringPlay ? 1 : 0, (p.pointsAttempted === 3 || p.scoreValue === 3) ? 3 : 0, (((p.participants || [])[0] || {}).athlete || {}).id || ""]); });
  const stt = (comp.status || {}).type || {};
  return {date: comp.date, neutral: !!comp.neutralSite, conf: !!comp.conferenceCompetition, teams, players, plays,
          done: stt.completed !== false, status: stt.shortDetail || stt.detail || ""};
}
function totalsFrom(stats, pts){
  const [fgm, fga] = split(stats["fieldGoalsMade-fieldGoalsAttempted"]);
  const [tpm, tpa] = split(stats["threePointFieldGoalsMade-threePointFieldGoalsAttempted"]);
  const [ftm, fta] = split(stats["freeThrowsMade-freeThrowsAttempted"]);
  return {pts: +pts, fgm, fga, tpm, tpa, ftm, fta, orb: +stats.offensiveRebounds || 0, drb: +stats.defensiveRebounds || 0,
          to: +(stats.totalTurnovers || stats.turnovers) || 0, stl: +stats.steals || 0};
}

/* ---------- core math ---------- */
// Possessions: FGA - OREB + TO + 0.475*FTA (standard box-score estimate)
function factors(t){
  if (!t || !t.fga) return null;
  const poss = t.fga - t.orb + t.to + 0.475 * t.fta;
  const g = t.g || 1; // season/multi-game totals carry a game count so raw numbers can be shown per game
  return {poss, ppp: t.pts / poss, efg: (t.fgm + 0.5 * t.tpm) / t.fga, tov: t.to / poss, orbMiss: t.orb / (t.fga - t.fgm),
          raw: {g, pts: t.pts / g, poss: poss / g, fgm: t.fgm / g, fga: t.fga / g, tpm: t.tpm / g, to: t.to / g, orb: t.orb / g, miss: (t.fga - t.fgm) / g}};
}
function seasonTeam(s){
  if (!s || !s.fieldGoalsAttempted) return null;
  return {pts: s.points, fgm: s.fieldGoalsMade, fga: s.fieldGoalsAttempted, tpm: s.threePointFieldGoalsMade, fta: s.freeThrowsAttempted, orb: s.offensiveRebounds, to: s.turnovers, g: s.gamesPlayed || 0};
}
function clockSecs(d){ const p = String(d || "0:00").split(":").map(Number); return p.length === 2 ? p[0] * 60 + p[1] : (+p[0] || 0); }
function elapsed(period, clock){
  const len = period <= 2 ? 1200 : 300, base = period <= 2 ? (period - 1) * 1200 : 2400 + (period - 3) * 300;
  return base + (len - Math.min(len, clockSecs(clock)));
}

function model(season, row, gm){
  const bay = gm.teams.find(t => t.id === BAY), opp = gm.teams.find(t => t.id !== BAY);
  const bayBox = totalsFrom(bay.stats, bay.score), oppBox = totalsFrom(opp.stats, opp.score);
  const bayHome = bay.homeAway === "home";
  const periods = Math.max(2, ...gm.plays.map(p => p[0]));
  const total = 2400 + Math.max(0, periods - 2) * 300;
  const by = {}; [BAY, opp.id].forEach(id => by[id] = [0, 1, 2].map(() => ({two: 0, three: 0, ft: 0})));
  const flow = [{t: 0, m: 0, bs: 0, os: 0}], tv = [];
  let lastB = 0, lastO = 0;
  gm.plays.forEach(([per, clk, team, hs, as, kind, val]) => {
    const t = elapsed(per, clk);
    if (kind === "T"){ tv.push({t, label: clk}); return; }
    if (!val || !team) return;
    const seg = by[team] && by[team][Math.min(per, 3) - 1];
    if (seg){ if (kind === "F") seg.ft += val; else if (val === 3) seg.three += val; else seg.two += val; }
    const bs = bayHome ? hs : as, os = bayHome ? as : hs;
    if (bs != null && (bs !== lastB || os !== lastO)){ flow.push({t, m: bs - os, bs, os}); lastB = bs; lastO = os; }
  });
  const isLive = gm.done === false;
  const lastT = gm.plays.length ? elapsed(gm.plays[gm.plays.length - 1][0], gm.plays[gm.plays.length - 1][1]) : 0;
  flow.push({t: isLive ? Math.max(lastT, flow[flow.length - 1].t) : total, m: flow[flow.length - 1].m, bs: lastB, os: lastO});
  let led = 0, maxLead = 0, minLead = 0;
  for (let i = 0; i < flow.length - 1; i++){ if (flow[i].m > 0) led += flow[i + 1].t - flow[i].t; maxLead = Math.max(maxLead, flow[i].m); minLead = Math.min(minLead, flow[i].m); }
  // shots (no free throws); ESPN y is feet out from the rim
  const shots = gm.plays.filter(p => p[5] === "S" && p[2] && p[7] != null && p[8] != null)
    .map(p => ({team: p[2], x: p[7], y: p[8], made: !!p[9], three: p[10] === 3, pid: p[11] || ""}))
    .filter(p => p.x >= 0 && p.x <= 50 && p.y >= -6 && p.y <= 45);
  return {isLive, season, row, gm, bay, opp, bayBox, oppBox, bf: factors(bayBox), of: factors(oppBox), by, flow, tv, total, periods, led, maxLead, minLead, shots};
}

/* ---------- KenPom ranks ---------- */
function rankOf(season, row){
  if (season.year === B.seasonYear){
    const r = (B.kenpom || {})[row.oppId];
    return r != null ? r : row.rank;
  }
  return row.rank;
}

/* ---------- render pieces ---------- */
function oppColor(m){ const c = (m.opp.color || "3a3a3a").toLowerCase(); return /^(fff|ffffff|f.f.f.)$/.test(c) ? "#3a3a3a" : "#" + c; }
const oppShort = m => m.opp.loc || m.opp.name;

/* ---------- team marks: ESPN logo, else a color badge ---------- */
function badge(team){
  const hex = c => /^[0-9a-f]{6}$/i.test(c || "") ? "#" + c : null;
  const isB = team.id === BAY;
  const bg = isB ? "#154734" : (hex(team.color) && !/^(fff|ffffff)$/i.test(team.color) ? hex(team.color) : "#3a3a3a");
  return `<span class="tbadge" style="background:${bg};color:${isB ? "#FFB81C" : "#fff"}">${esc(isB ? "BU" : String(team.abbr || "").slice(0, 4))}</span>`;
}
const LOGO = id => `https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/${encodeURIComponent(id)}.png&h=96&w=96`;
// Team logo from ESPN's logo images; falls back to the color badge if ESPN has none for a team
function mark(team){
  return `<span class="lg"><img src="${LOGO(team.id)}" alt="" onload="this.parentNode.classList.add('ok')" onerror="this.remove()">${badge(team)}</span>`;
}
const dayDot = d => { const s = new Date(d).toLocaleDateString("en-US", {month: "short", day: "numeric", timeZone: "America/Chicago"}); return /^May/.test(s) ? s : s.replace(" ", ". "); };
const secHead = (box, cap) => `<div class="sh"><span class="bx">${box}</span><i></i>${cap ? `<span class="cap">${cap}</span>` : ""}</div>`;

function header(m){
  const bs = +m.bay.score, os = +m.opp.score, win = bs > os;
  const site = m.row.site === "H" ? "Home" : m.row.site === "A" ? "Away" : "Neutral";
  const fmt = s => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
  const rk = rankOf(m.season, m.row);
  const brk = m.season.year === B.seasonYear ? (B.kenpom || {})[BAY] : m.season.bayRank;
  const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
  const kp = r => r != null ? `<small class="kp">${ord(+r)} in KenPom</small>` : "";
  const tag = m.isLive ? `<span class="fin lv">● ${esc(m.gm.status || "Live")}</span>` : `<span class="fin">Final${m.periods > 2 ? (m.periods > 3 ? "/" + (m.periods - 2) + "OT" : "/OT") : ""}</span>`;
  const bc = m.isLive || win ? "w" : "l", oc = m.isLive || !win ? "ow" : "l";
  return `<div class="sbd">
      <div class="tm">${mark(m.bay)}<span>Baylor${kp(brk)}</span></div>
      <div class="mid">${tag}<div class="bigs"><span class="${bc}">${esc(m.bay.score)}</span><i>-</i><span class="${oc}">${esc(m.opp.score)}</span></div></div>
      <div class="tm r"><span>${esc(oppShort(m))}${kp(rk)}</span>${mark(m.opp)}</div>
    </div>
    <div class="meta">${dayDot(m.gm.date)} · ${site}${m.row.post ? " · Postseason" : ""} · Baylor led for ${fmt(m.led)}${m.isLive ? " so far" : " of " + fmt(m.total)}</div>`;
}

function scoring(m){
  const tot = id => { const s = m.by[id]; return [0, 1, 2].reduce((a, h) => ({two: a.two + s[h].two, three: a.three + s[h].three, ft: a.ft + s[h].ft}), {two: 0, three: 0, ft: 0}); };
  const rows = [[m.bay, tot(BAY), [["var(--green)", "#fff"], ["var(--gold)", "#1c1c1a"], ["var(--sage)", "#1c1c1a"]], "var(--green)"],
                [m.opp, tot(m.opp.id), [["#5b5853", "#fff"], ["#9b968b", "#fff"], ["#c6c0b3", "#1c1c1a"]], "#6e6a63"]];
  const max = Math.max(1, ...rows.map(r => r[1].two + r[1].three + r[1].ft));
  const seg = (v, [bg, fg]) => v ? `<i style="width:${v / max * 100}%;background:${bg};color:${fg}">${v / max > .05 ? v : ""}</i>` : "";
  // key shows both teams' shades: Baylor's color, then the opponent's gray
  const key = (bc, oc, lab) => `<span><i style="background:${bc};margin-right:1px"></i><i style="background:${oc}"></i>${lab}</span>`;
  return secHead("Box score", `<span class="lgd">${key("var(--green)", rows[1][2][0][0], "2s")}${key("var(--gold)", rows[1][2][1][0], "3s")}${key("var(--sage)", rows[1][2][2][0], "Free throws")}</span>`)
    + `<div class="pts">` + rows.map(([team, s, c, col]) => `<span class="tn" style="color:${col}">${mark(team)}${esc(team.id === BAY ? "Baylor" : oppShort(m))}</span>
      <div class="bar">${seg(s.two, c[0])}${seg(s.three, c[1])}${seg(s.ft, c[2])}</div><span class="tot" style="color:${col}">${esc(team.score)}</span>`).join("") + `</div>`;
}

function flowChart(m){
  const W = 700, H = 280, L = 44, R = 10, T = 40, Bm = 30;
  const top = Math.max(10, Math.ceil(m.maxLead / 5) * 5 + 5), bot = Math.min(-10, Math.floor(m.minLead / 5) * 5 - 5);
  const x = t => L + t / m.total * (W - L - R), y = v => T + (top - v) / (top - bot) * (H - T - Bm);
  let d = `M${x(0)},${y(0)}`;
  m.flow.forEach((p, i) => { if (i) d += `H${x(p.t).toFixed(1)}V${y(p.m).toFixed(1)}`; });
  const area = d + `V${y(0)}Z`, oc = oppColor(m);
  const tv = m.tv.map((v, i) => `<line x1="${x(v.t)}" x2="${x(v.t)}" y1="${T}" y2="${H - Bm}" stroke="#b9af97" stroke-dasharray="2 3"/><text x="${x(v.t)}" y="${i % 2 ? T - 6 : T - 22}" font-size="13" text-anchor="middle" fill="#6f6a5e" font-family="Inter,sans-serif">TV ${esc(v.label)}</text>`).join("");
  const peak = m.flow.reduce((a, b) => b.m > a.m ? b : a, m.flow[0]);
  const vline = t => `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - Bm}" stroke="#1c1c1a" stroke-width=".8"/>`;
  const lab = (v, txt) => `<text x="${L - 7}" y="${y(v) + 5}" font-size="14" text-anchor="end" font-family="Inter,sans-serif" fill="#6f6a5e">${txt}</text>`;
  const step = top - bot > 40 ? 10 : 5;
  const grid = [...Array(Math.floor((top - bot) / step) + 1)].map((_, i) => bot + i * step).filter(v => v !== 0 && v > bot && v < top).map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ddd3bd" stroke-width=".8"/>`).join("");
  const low = m.flow.reduce((a, b) => b.m < a.m ? b : a, m.flow[0]);
  return secHead("Game flow", "Baylor's lead after every basket") + `
  <svg viewBox="0 0 ${W} ${H}" id="flowsvg" role="img" aria-label="Baylor margin over the game">
    <defs><clipPath id="cpos"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="cneg"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>
    ${grid}${tv}${vline(1200)}${m.periods > 2 ? vline(2400) : ""}
    <path d="${area}" fill="var(--green2)" clip-path="url(#cpos)"/><path d="${area}" fill="${oc}" opacity=".8" clip-path="url(#cneg)"/>
    <path d="${d}" fill="none" stroke="var(--green)" stroke-width="1.6"/>
    <line id="fcur" x1="0" x2="0" y1="${T}" y2="${H - Bm}" stroke="#1c1c1a" stroke-width="1.2" visibility="hidden"/>
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#1c1c1a" stroke-width=".8"/>
    ${[...Array(Math.floor((top - bot) / step) + 1)].map((_, i) => bot + i * step).filter(v => v !== 0 && v > bot && v < top).map(v => lab(v, (v > 0 ? "+" : "") + v)).join("")}${lab(0, "0")}
    <text x="${L}" y="${H - 8}" font-size="14" font-family="Oswald,Arial Narrow,sans-serif" fill="#6f6a5e">TIP</text>
    <text x="${x(1200)}" y="${H - 8}" font-size="14" text-anchor="middle" font-family="Oswald,Arial Narrow,sans-serif" fill="#6f6a5e">HALF</text>
    <text x="${W - R}" y="${H - 8}" font-size="14" text-anchor="end" font-family="Oswald,Arial Narrow,sans-serif" fill="#6f6a5e">END</text>
    ${peak.m > 0 ? `<text x="${Math.min(x(peak.t), W - 40)}" y="${y(peak.m) - 7}" font-size="17" font-weight="700" font-family="Oswald,Arial Narrow,sans-serif" fill="var(--green)" text-anchor="middle">Up ${peak.m}</text>` : ""}
    ${low.m < 0 ? `<text x="${Math.max(x(low.t), L + 24)}" y="${y(low.m) + 19}" font-size="17" font-weight="700" font-family="Oswald,Arial Narrow,sans-serif" fill="${oc}" text-anchor="middle">Down ${-low.m}</text>` : ""}
  </svg>`;
}

function fullCourt(m){
  const hy = 5.25, r3 = 22.146, cx3 = 3.35, run = hy + Math.sqrt(r3 * r3 - (25 - cx3) ** 2);
  const ln = `stroke="#8f8b83" stroke-width=".22" fill="none"`;
  // one basket end, drawn for the left side; the right side is the same group flipped
  const end = `<rect x="0" y="19" width="19" height="12" ${ln}/>
    <path d="M19,19 A6,6 0 0 1 19,31" ${ln}/><path d="M19,19 A6,6 0 0 0 19,31" ${ln} stroke-dasharray=".7 .7"/>
    <path d="M0,${cx3} H${run.toFixed(2)} A${r3},${r3} 0 0 1 ${run.toFixed(2)},${50 - cx3} H0" ${ln}/>
    <path d="M${hy},21 A4,4 0 0 1 ${hy},29" ${ln}/>
    <line x1="4" x2="4" y1="22" y2="28" stroke="#e6e2da" stroke-width=".35"/><circle cx="${hy}" cy="25" r=".75" ${ln}/>`;
  // ESPN: x = feet across (0-50), y = feet out from the rim. Baylor shoots at the left basket, the opponent at the right.
  const pos = (s, left) => left ? [s.y + hy, s.x] : [94 - (s.y + hy), 50 - s.x];
  const dots = (id, left, color) => m.shots.filter(s => s.team === id).map(s => { const [px, py] = pos(s, left);
    return `<circle cx="${Math.max(.9, Math.min(93.1, px)).toFixed(2)}" cy="${py.toFixed(2)}" r=".95" fill="${s.made ? color : "none"}" stroke="${color}" stroke-width="${s.made ? 0 : .24}" opacity="${s.made ? 1 : .8}"/>`; }).join("");
  const side = (box, name, r) => `<div class="sd ${r ? "r" : ""}"><b>${esc(name)}</b><small>FG</small>${box.fgm}-${box.fga}<br class="wide"><small class="gap">3PT</small>${box.tpm}-${box.tpa}</div>`;
  return secHead("Every shot", "● made · ○ missed") + `<div class="fc">
    ${side(m.bayBox, "Baylor", false)}
    <svg viewBox="-.6 -.6 95.2 51.2" role="img" aria-label="Shot map">
      <rect x="0" y="0" width="94" height="50" fill="#34343a" stroke="#1c1c1a" stroke-width=".5"/>
      <line x1="47" x2="47" y1="0" y2="50" ${ln}/><circle cx="47" cy="25" r="6" ${ln}/>
      ${end}<g transform="translate(94,50) rotate(180)">${end}</g>
      ${dots(BAY, true, "#FFB81C")}${dots(m.opp.id, false, "#ffffff")}
      ${m.shots.length ? "" : `<text x="47" y="26" font-size="2.4" text-anchor="middle" fill="#b8b3a8" font-family="Inter,sans-serif">No shot locations from ESPN for this game</text>`}
    </svg>
    ${side(m.oppBox, oppShort(m), true)}
  </div>`;
}

/* "Usual" baseline: last season (full) or this season (Baylor: every other game this season; opponent: ESPN season stats) */
const baseOf = () => { const v = store.get("bgn_base2", "this"); return ["this", "last", "2021"].includes(v) ? v : "this"; };
const sumTotals = (gs, side = "bay") => { const o = {}; gs.forEach(g => Object.entries(g[side]).forEach(([k, v]) => o[k] = (o[k] || 0) + (+v || 0))); o.g = gs.length; return o; };
const OPP_PENDING = {};
async function needOppStats(year, id){
  const k = String(year); B.stats[k] = B.stats[k] || {};
  const cur = year === B.seasonYear;
  if (OPP_PENDING[k + id] || (!cur && id in B.stats[k]) || (cur && OPP_PENDING[k + id] === false)) return;
  OPP_PENDING[k + id] = true;
  try { const s = await getJSON(`${API}/teams/${id}/statistics?season=${year}`, 8000); const o = {}; s.results.stats.categories.forEach(c => c.stats.forEach(x => o[x.name] = x.value)); B.stats[k][id] = o.fieldGoalsAttempted ? o : null; }
  catch(_){ if (!(id in B.stats[k])) B.stats[k][id] = null; }
  OPP_PENDING[k + id] = false; render();
}
function compare(m){
  const base = baseOf(), yr = m.season.year, lab = y => `${y - 1}-${String(y).slice(2)}`;
  let bl, ol, bNote, oNote, head; // head kept for reference
  if (base === "this"){
    const others = played(m.season).filter(g => g.id !== m.row.id);
    bl = others.length ? factors(sumTotals(others)) : null;
    const os = ((B.stats || {})[String(yr)] || {})[m.opp.id];
    if (os === undefined || (yr === B.seasonYear && OPP_PENDING[yr + m.opp.id] !== false)) needOppStats(yr, m.opp.id);
    ol = factors(seasonTeam(os));
    const n = os && os.gamesPlayed;
    head = `This game ● vs. their usual ○ · ${lab(yr)} season`;
    bNote = `vs. Baylor's other ${others.length} game${others.length === 1 ? "" : "s"} in ${lab(yr)}`;
    oNote = n ? `in its ${n} game${n === 1 ? "" : "s"} of ${lab(yr)}` : `in ${lab(yr)}`;
  } else if (base === "2021"){
    // the 2020-21 national title team: Baylor's offense and defense across that season's games
    const s21 = B.seasons.find(x => x.year === 2021), gs = s21 ? played(s21).filter(g => g.id !== m.row.id) : [];
    bl = gs.length ? factors(sumTotals(gs)) : null; ol = gs.length ? factors(sumTotals(gs, "o")) : null;
    bNote = "vs. Baylor's 2020-21 national title offense"; oNote = "";
  } else {
    const st = (B.stats || {})[String(yr - 1)] || {};
    bl = factors(seasonTeam(st[BAY])); ol = factors(seasonTeam(st[m.opp.id]));
    head = `This game ● vs. their usual ○ · full ${lab(yr - 1)} season`;
    bNote = `vs. Baylor's own ${lab(yr - 1)} offense`; oNote = `in ${lab(yr - 1)}`;
  }
  // raw counts behind each rate: tonight as whole numbers, "usual" as a per-game average
  const n0 = x => String(Math.round(x)), n1 = x => (Math.round(x * 10) / 10).toFixed(1);
  const rawOf = {
    ppp: (r, n) => `${n(r.pts)} pts on ${n(r.poss)} trips`,
    efg: (r, n) => `${n(r.fgm)}-${n(r.fga)} FG, ${n(r.tpm)} 3s`,
    tov: (r, n) => `${n(r.to)} turnovers`,
    orbMiss: (r, n) => `${n(r.orb)} of ${n(r.miss)} misses`};

               ["eFG%", "efg", m.bf, bl, true, pc, .15, .015],

function boxTable(m, teamId, isBay){

/* ---------- leading scorers: top 3 Baylor + the opponent's top scorer, each with a shot chart ---------- */

function leaders(m){

      reb: +v(a, "rebounds") || 0, ast: +v(a, "assists") || 0})).sort((x, y) => y.pts - x.pts || y.reb - x.reb).slice(0, n); };
  const tile = (r, tid, color, team) => { const a = r.a, mine = m.shots.filter(s => s.team === tid && s.pid === a[5]);

const TIERS = [["all", "All games", () => true], ["top100", "Top 100", r => r <= 100], ["mid", "101–249", r => r > 100 && r < 250], ["low", "250th or worse", r => r >= 250]];

function agg(rows, metric){ let a = 0, b = 0; rows.forEach(r => { const [x, y] = metric[2](r); a += x; b += y; }); return rows.length && b ? a / b : null; }

      <div class="pg">${box("PPG", avg("points"))}${box("RPG", avg("rebounds"))}${box("APG", avg("assists"))}${box("MPG", avg("minutes"))}
        ${box("FG%", pct("fgm", "fga"))}${box("3P%", pct("tpm", "tpa"))}${box("FT%", pct("ftm", "fta"))}${box("SPG", avg("steals"))}</div>

      <div class="foot">Stats from ESPN box scores. Prospect grades from 247Sports' Baylor roster and commits pages, 2019-20 on: high school rating (or 247 Composite where that's all 247 lists) and transfer portal rating. Stars: 98+ five, 90–97 four, 80–89 three, 70–79 two.</div>` : `<div class="pb"><div class="sec" style="margin-top:14px">${esc(m.season.label)} averages <small>${esc(teamName)} · from ESPN</small></div>

  if (!isBay) oppAverages(aid, m.season.label);

// Opponent season averages + bio, straight from ESPN's athlete endpoints (CORS-open)
async function oppAverages(aid, label){
  const base = "https://site.api.espn.com/apis/common/v3/sports/basketball/mens-college-basketball/athletes/" + encodeURIComponent(aid);
  const box = (lab, v) => `<div><b>${esc(v ?? "—")}</b><span>${lab}</span></div>`;
  try {
    const [st, bio] = await Promise.all([getJSON(base + "/stats", 8000), getJSON(base, 8000).catch(() => null)]);
    const ath = bio && bio.athlete;
    if (ath){ const b = [ath.position && ath.position.abbreviation, ath.displayClass || (ath.experience && ath.experience.displayValue), ath.displayHeight, ath.displayWeight].filter(Boolean).map(esc).join(" · ");
      const el = $("#pc .bio"); if (el && b) el.textContent = ""; if (el && b) el.innerHTML = b; }
    const cat = (st.categories || []).find(c => c.name === "averages"); if (!cat) throw 0;
    const row = (cat.statistics || []).find(x => (x.season || {}).displayName === label) || (cat.statistics || []).slice(-1)[0];
    if (!row) throw 0;
    const L = cat.labels, v = k => row.stats[L.indexOf(k)];
    const pctv = k => v(k) != null && v(k) !== "" ? v(k) + "%" : "—";
    const el = $("#oppavg"); if (!el) return;
    el.innerHTML = `<div class="note" style="margin-top:2px">${esc(v("GP") || 0)} games, ${esc(v("GS") || 0)} starts · ${esc((row.season || {}).displayName || "")}</div>
      <div class="pg">${box("PPG", v("PTS"))}${box("RPG", v("REB"))}${box("APG", v("AST"))}${box("MPG", v("MIN"))}${box("FG%", pctv("FG%"))}${box("3P%", pctv("3P%"))}${box("FT%", pctv("FT%"))}${box("SPG", v("STL"))}</div>`;
  } catch(e){ const el = $("#oppavg"); if (el) el.innerHTML = `<div class="note">Couldn't load season stats from ESPN right now.</div>`; }
}
function closeCard(){ $("#ov").classList.remove("on"); document.body.classList.remove("noscroll"); }

/* ---------- season record ---------- */
function record(season){
  const gs = played(season);
  const wl = f => { const x = gs.filter(f); const w = x.filter(g => g.bay.pts > g.o.pts).length; return [w, x.length - w]; };
  const fmt = ([w, l]) => w + "-" + l;
  const all = wl(() => true), conf = wl(g => g.conf && g.site !== "N"), home = wl(g => g.site === "H"), away = wl(g => g.site === "A"), neu = wl(g => g.site === "N"), post = wl(g => g.post);
  let streak = "";
  if (gs.length){ const last = gs[gs.length - 1], won = last.bay.pts > last.o.pts; let n = 0;
    for (let i = gs.length - 1; i >= 0 && (gs[i].bay.pts > gs[i].o.pts) === won; i--) n++; streak = (won ? "W" : "L") + n; }
  const form = gs.slice(-5).map(g => g.bay.pts > g.o.pts ? `<i>W</i>` : `<i class="L">L</i>`).join("");
  const cell = (lab, v) => `<div><span class="lbl">${lab}</span><b>${v}</b></div>`;
  return `<div><div class="lbl">${esc(season.label)} record</div><div class="wl2">${fmt(all)}</div><div class="form">${form}</div></div>
    <div class="grid">${cell("Big 12", fmt(conf))}${cell("Home", fmt(home))}${cell("Away", fmt(away))}${cell("Neutral", fmt(neu))}${post[0] + post[1] ? cell("Postseason", fmt(post)) : ""}
      <div><span class="lbl">Streak</span><b>${streak || "—"}</b></div></div>`;
}
const recStr = s => { const gs = played(s), w = gs.filter(g => g.bay.pts > g.o.pts).length; return w + "-" + (gs.length - w); };

/* ---------- page ---------- */
let state = {season: null, game: null, tab: "flow"};
function pickFromHash(){
  const h = (location.hash || "").slice(1);
  if (h.startsWith("g")){ const f = findGame(h.slice(1)); if (f){ state.season = f.s.year; state.game = f.g.id; return; } }
  if (h.startsWith("s")){ const s = B.seasons.find(x => String(x.year) === h.slice(1)); if (s){ state.season = s.year; state.game = null; return; } }
  if (state.season == null){ const cs = curSeason(); state.season = shown(cs).length ? cs.year : B.seasons[B.seasons.length - 2].year; }
}
let renderSeq = 0;
async function render(){
  const seq = ++renderSeq;
  pickFromHash();
  const season = B.seasons.find(s => s.year === state.season);
  const games = shown(season);
  // No game picked: show the latest game that has tipped off (a live game takes over once it starts)
  const picked = (location.hash || "").startsWith("#g");
  if (!picked || !games.some(g => g.id === state.game)) state.game = games.length ? games[games.length - 1].id : null;
  const saved = live ? "" : "Saved " + new Date(B.pulled).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/Chicago"});
  $("#src").innerHTML = `<span class="s1">ESPN<span class="s1x"> box score &amp;</span></span><br class="sbr"><span class="s2"><span class="s1x">play-by-play</span><i class="sdot"> · </i>${live ? "live" : "saved"}</span>`;
  { const rm = $("#rfmsg"); if (rm && (!rm.textContent || rm.dataset.auto)){ rm.textContent = saved; rm.dataset.auto = saved ? "1" : ""; } }
  fitTitle();
  $("#season").innerHTML = B.seasons.slice().reverse().map(s => `<option value="${s.year}" ${s.year === season.year ? "selected" : ""}>${s.label}${s.year === B.seasonYear ? " (this season)" : ""} · ${recStr(s)}</option>`).join("");
  $("#rec").innerHTML = record(season);
  $("#chips").innerHTML = games.slice().reverse().map(g => { const w = g.bay.pts > g.o.pts, lv = !g.completed;
    return `<button class="chip ${g.id === state.game ? "on" : ""} ${lv ? "LV" : w ? "" : "L"}" data-g="${g.id}">${day(g.date)} ${g.site === "A" ? "at" : "vs"} ${esc(g.oppAbbr)}<span class="r">${lv ? "LIVE" : w ? "W" : "L"} ${g.bay.pts}-${g.o.pts}</span></button>`; }).join("");
  const on = $("#chips .chip.on"); if (on) on.scrollIntoView({block: "nearest", inline: "nearest"});
  if (!state.game){ $("#app").innerHTML = `<div class="empty">No completed games in ${esc(season.label)} yet.</div>` + watch(season); return; }
  const row = games.find(g => g.id === state.game);
  let gm;
  try { gm = await loadGame(row.id); } catch(e){ if (seq === renderSeq) $("#app").innerHTML = `<div class="empty">Couldn't load this game's data.</div>` + watch(season); return; }
  if (seq !== renderSeq) return;
  const m = model(season, row, gm); CURM = m;
  const tab = state.tab;
  const TABS = [["flow", "Game Flow"], ["box", "Box Score"], ["eff", "Efficiency"]];
  const tabBar = `<div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button type="button" role="tab" class="tab ${tab === k ? "on" : ""}" aria-selected="${tab === k}" data-tab="${k}">${t}</button>`).join("")}</div>`;
  $("#app").innerHTML =
      `<div class="gc"><div class="in">${header(m)}</div></div>` + tabBar
    + (tab === "flow" ? `<div class="gc"><div class="in">${flowChart(m)}${fullCourt(m)}</div></div>`
        + `<div class="gc"><div class="in">${leaders(m)}</div><div class="cf">Data: ESPN box score &amp; play-by-play.</div></div>` : "")
    + (tab === "box" ? `<div class="gc"><div class="in">${scoring(m)}${boxTable(m, BAY, true)}${boxTable(m, m.opp.id, false)}
        <div class="bkey">Starters above the line · <span style="background:var(--green);color:#fff">boxed</span> = team high · <span style="background:#ecb7ab">hotter</span> / <span style="background:#c3cfe9">colder</span> than D1 average (FG 44%, 3PT 34%, FT 71%), 3+ tries</div></div></div>` : "")
    + (tab === "eff" ? `<div class="gc"><div class="in">${compare(m)}</div>
        <div class="cf">Points per trip = points per possession · eFG% counts threes 1.5× · turnovers = % of trips · off. rebounds = offensive rebounds per missed field goal · usual = this season's other games (opponent: their ESPN season stats so far), the full previous season on ESPN, or Baylor's 2020-21 national title team (offense and defense). Usual sits at the center of each track; the dot shows how far tonight swung. Usual counts are per-game averages. Data: ESPN.</div></div>` + watch(season) : "");
  wireFlowTip(m); fitBox();
}
function fitBox(){
  document.querySelectorAll("table.bs").forEach(tb => {
    let fs = 13; tb.style.fontSize = fs + "px";
    const w = tb.parentNode.clientWidth;
    while (tb.scrollWidth > w && fs > 7.5){ fs -= .25; tb.style.fontSize = fs + "px"; }
  });
}
window.addEventListener("resize", () => fitBox());

function wireFlowTip(m){
  const svg = $("#flowsvg"), tip = $("#tip"); if (!svg) return;
  const cur = svg.querySelector("#fcur");
  const hide = () => { tip.style.display = "none"; if (cur) cur.setAttribute("visibility", "hidden"); };
  const show = e => {
    const r = svg.getBoundingClientRect(), W = 700, L = 34, R = 10;
    const pt = e.touches ? e.touches[0] : e;
    const t = ((pt.clientX - r.left) / r.width * W - L) / (W - L - R) * m.total;
    if (t < 0 || t > m.total){ hide(); return; }
    let p = m.flow[0]; for (const q of m.flow){ if (q.t <= t) p = q; else break; }
    const per = t < 1200 ? "1st half" : t < 2400 ? "2nd half" : "OT";
    const left = t < 2400 ? 1200 - (t % 1200) : 300 - ((t - 2400) % 300);
    tip.textContent = `${per} ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, "0")} · Baylor ${p.bs}-${p.os} (${p.m > 0 ? "+" : ""}${p.m})`;
    tip.style.display = "block";
    const vx = (pt.clientX - r.left) / r.width * W;
    if (cur){ cur.setAttribute("x1", vx); cur.setAttribute("x2", vx); cur.setAttribute("visibility", "visible"); }
    if (e.touches){
      // finger on the chart: show the readout above the chart (below it if the chart is at the top of the screen)
      const above = r.top - tip.offsetHeight - 8;
      tip.style.top = (above > 8 ? above : r.bottom + 8) + "px";
      tip.style.left = Math.max(8, Math.min(pt.clientX - tip.offsetWidth / 2, window.innerWidth - tip.offsetWidth - 8)) + "px";
    } else {
      tip.style.left = Math.min(pt.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (pt.clientY - 34) + "px";
    }
  };
  svg.addEventListener("mousemove", show); svg.addEventListener("touchstart", show, {passive: true}); svg.addEventListener("touchmove", show, {passive: true});
  svg.addEventListener("mouseleave", hide); svg.addEventListener("touchend", () => setTimeout(hide, 1200));
}

document.addEventListener("click", e => {
  if (e.target.closest("input")) return;
  const tb = e.target.closest("[data-tab]"); if (tb){ if (state.tab !== tb.dataset.tab){ state.tab = tb.dataset.tab; const y = Math.min(window.scrollY, $("#app").offsetTop); render().then(() => window.scrollTo({top: y})); } return; }
  const pl = e.target.closest("[data-pl]"); if (pl){ playerCard(pl.dataset.pl, pl.dataset.tm || BAY); return; }

  const bs = e.target.closest("[data-base]"); if (bs){ store.set("bgn_base2", bs.dataset.base); const y = window.scrollY; render().then(() => window.scrollTo({top: y})); return; }
  const f = e.target.closest("[data-tier]"); if (f){ store.set("bgn_tier", f.dataset.tier); render().then(() => $("#watch").scrollIntoView({block: "nearest"})); return; }
  const mt = e.target.closest("[data-metric]"); if (mt){ store.set("bgn_metric", mt.dataset.metric); render().then(() => $("#watch").scrollIntoView({block: "nearest"})); }
});
document.addEventListener("change", e => {
  if (e.target.id === "season"){ location.hash = "s" + e.target.value; return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });
window.addEventListener("hashchange", () => { state.game = null; render(); });

/* Live refresh: straight from ESPN where the page may reach it (the GitHub Pages site). */
async function tryLive(){
  try {
    const sched = await getJSON(API + "/teams/" + BAY + "/schedule", 8000);
    const cs = curSeason();
    if (!cs || sched.season.year !== B.seasonYear) return false;
    const prior = String(B.seasonYear - 1); B.stats[prior] = B.stats[prior] || {};
    for (const e of sched.events){
      const c = e.competitions[0], opp = c.competitors.find(t => t.team.id !== BAY), bay = c.competitors.find(t => t.team.id === BAY);
      let g = cs.games.find(x => x.id === e.id);
      if (!g){ g = {id: e.id, date: e.date, opp: opp.team.location, oppName: opp.team.displayName, oppAbbr: opp.team.abbreviation, oppId: opp.team.id,
                    site: c.neutralSite ? "N" : (bay.homeAway === "home" ? "H" : "A"), post: false, rank: (B.kenpom || {})[opp.team.id] ?? null, completed: false}; cs.games.push(g); }
      const st = c.status.type;
      if (g.completed && g.bay) continue;                         // already have the final
      g.state = st.state;
      if (!(st.completed || st.state === "in")) continue;          // not tipped off yet
      const gm = compact(await getJSON(API + "/summary?event=" + e.id, 15000));
      const bt = gm.teams.find(t => t.id === BAY), ot = gm.teams.find(t => t.id !== BAY);
      GAMES[e.id] = gm; g.conf = gm.conf;
      g.bay = totalsFrom(bt.stats, bt.score); g.o = totalsFrom(ot.stats, ot.score);
      g.completed = !!st.completed && gm.done; if (!g.completed) g.state = "in";
      const bp = gm.players[BAY]; cs.players = cs.players || {};
      if (g.completed && bp){ const ix = k => bp.keys.indexOf(k);
        bp.athletes.forEach(a => { const st = a[3]; if (!st || !st.length || !a[5]) return;
          const t = cs.players[a[5]] = cs.players[a[5]] || {name: a[0], jersey: a[4], pos: a[1], gp: 0, gs: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0, ftm: 0, fta: 0, minutes: 0, points: 0, rebounds: 0, assists: 0, steals: 0, blocks: 0, turnovers: 0};
          t.gp++; if (a[2]) t.gs++;
          ["minutes", "points", "rebounds", "assists", "steals", "blocks", "turnovers"].forEach(k => t[k] += +st[ix(k)] || 0);
          [["fieldGoalsMade-fieldGoalsAttempted", "fgm", "fga"], ["threePointFieldGoalsMade-threePointFieldGoalsAttempted", "tpm", "tpa"], ["freeThrowsMade-freeThrowsAttempted", "ftm", "fta"]].forEach(([k, mk, at]) => { const [x, y] = split(st[ix(k)]); t[mk] += x; t[at] += y; });
        }); }
      if (!(g.oppId in B.stats[prior])){
        try { const s = await getJSON(`${API}/teams/${g.oppId}/statistics?season=${prior}`, 8000); const o = {}; s.results.stats.categories.forEach(cat => cat.stats.forEach(x => o[x.name] = x.value)); B.stats[prior][g.oppId] = o.fieldGoalsAttempted ? o : null; }
        catch(_){ B.stats[prior][g.oppId] = null; }
      }
    }
    cs.games.sort((a, b) => a.date < b.date ? -1 : 1);
    B.pulled = sched.timestamp; live = true;
    return true;
  } catch(_){ return false; }
}

// Title fills the left side of the title section: largest size (up to 40px) that fits its width and height
function fitTitle(){
  const box = document.querySelector(".top>.navrow+div"); if (!box) return;
  const vis = [...box.children].filter(e => e.offsetParent !== null);
  // size both sport pages the same: measure with the longer word, BASKETBALL, then put the real word back
  const words = [box.querySelector(".brand span"), box.querySelector(".v2-sub")].filter(Boolean).map(el => { const n = [...el.childNodes].reverse().find(x => x.nodeType === 3 && x.textContent.trim()); const t = n ? n.textContent : null; if (n) n.textContent = "BASKETBALL"; return [n, t]; });
  const right = e => Math.max(e.getBoundingClientRect().right, ...[...e.querySelectorAll("*")].filter(c => c.offsetParent !== null).map(c => c.getBoundingClientRect().right));
  const fits = () => { const bx = box.getBoundingClientRect(); return vis.every(e => right(e) <= bx.right + 1) && (vis.length ? vis[vis.length - 1].getBoundingClientRect().bottom - vis[0].getBoundingClientRect().top : 0) <= box.clientHeight; };
  let lo = 14, hi = window.innerWidth > 520 ? 40 : 34;
  while (hi - lo > .5){ const mid = (lo + hi) / 2; box.style.setProperty("--tf", mid + "px"); if (fits()) lo = mid; else hi = mid; }
  box.style.setProperty("--tf", lo + "px");
  words.forEach(([n, t]) => { if (n) n.textContent = t; });
}
window.addEventListener("resize", () => fitTitle());
new MutationObserver(() => requestAnimationFrame(fitTitle)).observe(document.documentElement, {attributes: true, attributeFilter: ["class", "data-theme"]});
// Refit whenever a web font finishes loading (the 80s wordmark font often arrives after first paint)
if (document.fonts){ document.fonts.ready.then(() => fitTitle()); document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => fitTitle()); }
[300, 1000, 2500].forEach(ms => setTimeout(() => fitTitle(), ms));
document.addEventListener("load", e => { if (e.target.matches && e.target.matches(".blogo,.v2-paw")) fitTitle(); }, true);

async function refresh(){
  const btn = $("#refresh"), msg = $("#rfmsg");
  btn.disabled = true; msg.textContent = "Refreshing…"; msg.dataset.auto = "";
  try { await loadIndex(); } catch(_){}
  Object.keys(GAMES).forEach(k => { const f = findGame(k); if (!f || !f.g.completed) delete GAMES[k]; });
  const ok = await tryLive();
  btn.disabled = false;
  msg.textContent = ok ? "Live from ESPN · " + new Date().toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"})
                       : "ESPN unreachable · saved data";
  await render();
}
$("#refresh").addEventListener("click", refresh);

(async function start(){
  try { await loadIndex(); } catch(e){ $("#app").innerHTML = `<div class="empty">Couldn't load the saved data (data/mbb.json).</div>`; return; }
  // Check ESPN before the first draw so a live game opens directly, without flashing the last final.
  // If ESPN is slow (over 5s), show the saved data and switch when the live pull lands.
  const pull = tryLive(), wait = new Promise(r => setTimeout(() => r("slow"), 5000));
  const first = await Promise.race([pull, wait]);
  await render();
  if (first === "slow" && await pull) render();
})();
})();
